services:
  cloudflare-dns:
    build: .
    image: company-dns-manager:local
    container_name: cloudflare-dns-manager
    env_file: .env
    environment:
      DNS_PANEL_AUTO_LOGIN: ${DNS_PANEL_AUTO_LOGIN:-true}
      DNS_AUDIT_DB: /data/audit.sqlite3
    volumes:
      - dns-audit:/data
    ports:
      - "127.0.0.1:8788:8787"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/healthz', timeout=3).close()"]
      interval: 30s
      timeout: 5s

volumes:
  dns-audit:
